<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV_ Bùi Thu Hằng_Business Data Analyst</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --primary: #5b9bd5;
      --secondary: #1f3d5c;
      --accent: #2c6cad;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1f2937;
      --text-muted: #64748b;
      --border: rgba(31, 61, 92, 0.14);
      --header-h: 56px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
    }
    header::before {
      content: '';
      display: block;
      height: 3px;
      background: linear-gradient(90deg, #1f3d5c 0%, #2c6cad 55%, #5b9bd5 100%);
    }
    .header-inner {
      width: 100%;
      height: var(--header-h);
      margin: 0;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .header-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
    .title-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(44, 108, 173, 0.10);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .title-icon svg { width: 15px; height: 15px; }
    .title-block { display: flex; flex-direction: column; min-width: 0; }
    .title { font-family: 'Times New Roman', Times, serif; font-size: 1.4rem; font-weight: 400; color: var(--secondary); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .actions { display: flex; gap: 0.5rem; align-items: center; flex-shrink: 0; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      height: 36px;
      padding: 0 0.9rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(44, 108, 173, 0.45);
    }
    .btn-primary:hover { background: #1f558c; box-shadow: 0 4px 14px rgba(44, 108, 173, 0.55); }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: transparent;
    }
    .btn-ghost:hover { background: rgba(31, 61, 92, 0.06); color: var(--secondary); }
    .btn-outline {
      background: transparent;
      color: var(--secondary);
      border-color: var(--border);
    }
    .btn-outline:hover { background: rgba(31, 61, 92, 0.04); border-color: var(--accent); color: var(--accent); }
    .btn-icon {
      background: transparent;
      color: var(--text-muted);
      border-color: transparent;
      padding: 0;
      width: 36px;
      height: 36px;
    }
    .btn-icon:hover { background: rgba(44, 108, 173, 0.10); color: var(--accent); }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      width: 100%;
    }
    .viewer {
      flex: 1;
      min-height: 0;
      background: #525659;
      display: flex;
      justify-content: center;
    }
    .viewer iframe {
      width: 100%;
      max-width: 860px;
      height: 100%;
      border: 0;
      display: block;
    }

    .mobile-fallback {
      display: none;
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 14px;
      padding: 2rem 1.5rem;
      box-shadow: 0 10px 30px -18px rgba(15, 23, 42, 0.35);
      text-align: center;
    }
    .mf-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(44, 108, 173, 0.10);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.1rem;
    }
    .mf-icon svg { width: 26px; height: 26px; }
    .mf-name { font-size: 1.1rem; font-weight: 700; color: var(--secondary); margin-bottom: 0.2rem; }
    .mf-role { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem; }
    .mf-lead { font-size: 0.9rem; color: var(--text); margin: 0 0 1.5rem; line-height: 1.55; }
    .mf-actions { display: flex; flex-direction: column; gap: 0.65rem; }
    .mf-btn { width: 100%; height: 44px; font-size: 0.9rem; }

    @media (max-width: 720px) {
      :root { --header-h: 52px; }
      html, body { height: auto; min-height: 100%; }
      body { overflow: auto; }
      .header-inner { padding: 0 1rem; }
      .header-left { gap: 0.5rem; }
      .title { font-size: 1.05rem; }
      .back-label { display: none; }
      .btn { padding: 0 0.6rem; font-size: 0.8rem; }
      .btn-ghost { padding: 0 0.5rem; }
      main { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - var(--header-h)); padding: 1.5rem 1rem; overflow: visible; }
      .viewer { display: none; }
      .mobile-fallback { display: block; }
    }

    @media print {
      header, #toast { display: none !important; }
      body { overflow: visible; background: #fff; }
      main { display: block; }
      .viewer { background: #fff; overflow: visible; }
      .viewer iframe { height: auto; }
    }

    .icon { width: 16px; height: 16px; flex-shrink: 0; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-left">
        <a class="btn btn-ghost" href="/" aria-label="Back to home">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>

        </a>
        <span class="title-icon" aria-hidden="true">

        </span>
        <div class="title-block">
          <div class="title">CV_ Bùi Thu Hằng_Business Data Analyst</div>
        </div>
      </div>
      <div class="actions">
        <a class="btn btn-icon" id="mailBtn" href="mailto:buihang.work@gmail.com?subject=Job%20Opportunity%20-%20Bui%20Thu%20Hang" aria-label="Email" title="Copy email & open mail app">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        </a>
        <a class="btn btn-icon" href="https://www.linkedin.com/in/buithuhang/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45C23.2 24 24 23.23 24 22.28V1.72C24 .77 23.2 0 22.22 0z"/></svg>
        </a>
        <a class="btn btn-icon" href="https://github.com/BuiHang-stp" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.9 1.3 1.9 1.3 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.3.5-2.4 1.3-3.2-.2-.4-.6-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.7 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>
        </a>
        <a class="btn btn-primary" href="/CV_BuiThuHang.pdf" download="CV_ Bùi Thu Hằng_Business Data Analyst.pdf">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download CV
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="viewer">
      <iframe src="/CV_BuiThuHang.pdf#toolbar=0&navpanes=0&scrollbar=0&zoom=page-width" title="Bui Thu Hang CV"></iframe>
    </div>

    <div class="mobile-fallback">
      <div class="mf-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
      </div>
      <div class="mf-name">Bùi Thu Hằng</div>
      <div class="mf-role">Business Data Analyst · CV 1 trang</div>
      <p class="mf-lead">Xem bản đầy đủ dưới dạng PDF</p>
      <div class="mf-actions">
        <a class="btn btn-primary mf-btn" href="/CV_BuiThuHang.pdf" download="CV_ Bùi Thu Hằng_Business Data Analyst.pdf">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

        <a class="btn btn-outline mf-btn" href="/CV_BuiThuHang.pdf" target="_blank" rel="noopener noreferrer">

  <div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f3d5c;color:#fff;padding:0.7rem 1.2rem;border-radius:10px;font-size:0.9rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.2);opacity:0;pointer-events:none;transition:opacity 0.25s ease, transform 0.25s ease;z-index:100;">Email copied to clipboard!</div>

  <script>
    (function () {
      var EMAIL = 'buihang.work@gmail.com';
      var mailBtn = document.getElementById('mailBtn');
      var toast = document.getElementById('toast');

      function showToast(msg) {
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
        clearTimeout(showToast._t);
        showToast._t = setTimeout(function () {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(-50%) translateY(20px)';
        }, 2200);
      }

      if (mailBtn) {
        mailBtn.addEventListener('click', function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(EMAIL).then(function () {
              showToast('Email copied: ' + EMAIL);
            }).catch(function () {
              showToast(EMAIL);
            });
          } else {
            showToast(EMAIL);
          }
        });
      }
    })();
  </script>
</body>
</html>
