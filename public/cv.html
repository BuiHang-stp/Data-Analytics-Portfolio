<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV_ Bùi Thu Hằng_Business Data Analyst</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --primary: #5b9bd5;
      --secondary: #1f3d5c;
      --accent: #2c6cad;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --text: #1f2937;
      --text-muted: #64748b;
      --border: rgba(31, 61, 92, 0.14);
      --header-h: 56px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
    }
    header::before {
      content: '';
      display: block;
      height: 3px;
      background: linear-gradient(90deg, #1f3d5c 0%, #2c6cad 55%, #5b9bd5 100%);
    }
    .header-inner {
      width: 100%;
      height: var(--header-h);
      margin: 0;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .header-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
    .title-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(44, 108, 173, 0.10);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .title-icon svg { width: 15px; height: 15px; }
    .title-block { display: flex; flex-direction: column; min-width: 0; }
    .title { font-family: 'Times New Roman', Times, serif; font-size: 1.2rem; font-weight: 400; color: var(--secondary); letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .actions { display: flex; gap: 0.5rem; align-items: center; flex-shrink: 0; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      height: 36px;
      padding: 0 0.9rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(44, 108, 173, 0.45);
    }
    .btn-primary:hover { background: #1f558c; box-shadow: 0 4px 14px rgba(44, 108, 173, 0.55); }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: transparent;
    }
    .btn-ghost:hover { background: rgba(31, 61, 92, 0.06); color: var(--secondary); }
    .btn-icon {
      background: transparent;
      color: var(--text-muted);
      border-color: transparent;
      padding: 0;
      width: 36px;
      height: 36px;
    }
    .btn-icon:hover { background: rgba(44, 108, 173, 0.10); color: var(--accent); }

    .email-popover-wrap { position: relative; display: inline-block; }
    .email-popover {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 280px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.15);
      padding: 0.6rem;
      z-index: 100;
      transform-origin: top right;
      animation: emailPopIn 0.15s ease-out;
    }
    .email-popover[hidden] { display: none; }
    @keyframes emailPopIn {
      from { opacity: 0; transform: translateY(4px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .email-popover__address {
      padding: 0.4rem 0.55rem 0.55rem;
      font-size: 0.85rem;
      color: var(--text);
      font-weight: 500;
      word-break: break-all;
    }
    .email-popover__copy {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.55rem 0.7rem;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 7px;
      font-weight: 600;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.12s ease;
    }
    .email-popover__copy:hover { background: #1f558c; }
    .email-popover__copy:active { transform: scale(0.98); }
    .email-popover__copy svg { width: 15px; height: 15px; }
    .email-popover__divider {
      height: 1px;
      background: var(--border);
      margin: 0.55rem 0;
    }
    .email-popover__link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.5rem 0.65rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.85rem;
      border-radius: 6px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .email-popover__link:hover { background: rgba(44, 108, 173, 0.08); color: var(--accent); }
    .email-popover__link svg { width: 14px; height: 14px; opacity: 0.55; flex-shrink: 0; }

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      width: 100%;
    }
    .viewer {
      flex: 1;
      min-height: 0;
      background: #525659;
      display: flex;
      justify-content: center;
    }
    .viewer iframe {
      width: 100%;
      max-width: 860px;
      height: 100%;
      border: 0;
      display: block;
    }

    @media (max-width: 720px) {
      :root { --header-h: 52px; }
      .header-inner { padding: 0 1rem; }
      .header-left { gap: 0.5rem; }
      .title { font-size: 1.05rem; }
      .back-label { display: none; }
      .btn { padding: 0 0.6rem; font-size: 0.8rem; }
      .btn-ghost { padding: 0 0.5rem; }
    }

    @media print {
      header, #toast { display: none !important; }
      body { overflow: visible; background: #fff; }
      main { display: block; }
      .viewer { background: #fff; overflow: visible; }
      .viewer iframe { height: auto; }
    }

    .icon { width: 16px; height: 16px; flex-shrink: 0; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-left">
        <a class="btn btn-ghost" href="/" aria-label="Back to home">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          <span class="back-label">Back</span>
        </a>
        <span class="title-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        </span>
        <div class="title-block">
          <div class="title">CV_ Bùi Thu Hằng_Business Data Analyst</div>
        </div>
      </div>
      <div class="actions">
        <div class="email-popover-wrap">
          <button class="btn btn-icon" id="mailBtn" type="button" aria-label="Email" title="buihang.work@gmail.com" aria-haspopup="menu" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          </button>
          <div class="email-popover" id="emailPopover" role="menu" hidden>
            <div class="email-popover__address">buihang.work@gmail.com</div>
            <button type="button" class="email-popover__copy" id="copyBtn">
              <svg class="copy-icon copy-icon--copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <svg class="copy-icon copy-icon--check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" hidden><polyline points="20 6 9 17 4 12"/></svg>
              <span class="copy-text">Copy address</span>
            </button>
            <div class="email-popover__divider"></div>
            <a class="email-popover__link" href="https://mail.google.com/mail/?view=cm&fs=1&to=buihang.work@gmail.com" target="_blank" rel="noopener noreferrer" role="menuitem">
              <span>Open in Gmail</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </a>
            <a class="email-popover__link" href="https://outlook.live.com/mail/0/deeplink/compose?to=buihang.work@gmail.com" target="_blank" rel="noopener noreferrer" role="menuitem">
              <span>Open in Outlook</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </a>
            <a class="email-popover__link" href="mailto:buihang.work@gmail.com" role="menuitem">
              <span>Open in default mail app</span>
            </a>
          </div>
        </div>
        <a class="btn btn-icon" href="https://www.linkedin.com/in/buithuhang/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45C23.2 24 24 23.23 24 22.28V1.72C24 .77 23.2 0 22.22 0z"/></svg>
        </a>
        <a class="btn btn-primary" href="/CV_BuiThuHang.pdf" download="CV_ Bùi Thu Hằng_Business Data Analyst.pdf">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download CV
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="viewer">
      <iframe src="/CV_BuiThuHang.pdf#toolbar=0&navpanes=0&scrollbar=0&zoom=page-width" title="Bui Thu Hang CV"></iframe>
    </div>
  </main>

  <script>
    (function () {
      var EMAIL = 'buihang.work@gmail.com';
      var mailBtn = document.getElementById('mailBtn');
      var popover = document.getElementById('emailPopover');
      var copyBtn = document.getElementById('copyBtn');
      if (!mailBtn || !popover || !copyBtn) return;

      var copyText = copyBtn.querySelector('.copy-text');
      var iconCopy = copyBtn.querySelector('.copy-icon--copy');
      var iconCheck = copyBtn.querySelector('.copy-icon--check');
      var copyTimer;

      function setOpen(next) {
        popover.hidden = !next;
        mailBtn.setAttribute('aria-expanded', next ? 'true' : 'false');
      }

      mailBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        setOpen(popover.hidden);
      });

      document.addEventListener('mousedown', function (e) {
        if (popover.hidden) return;
        if (!popover.contains(e.target) && !mailBtn.contains(e.target)) setOpen(false);
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !popover.hidden) setOpen(false);
      });

      copyBtn.addEventListener('click', function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(EMAIL).catch(function () {});
        }
        copyText.textContent = 'Copied!';
        iconCopy.hidden = true;
        iconCheck.hidden = false;
        clearTimeout(copyTimer);
        copyTimer = setTimeout(function () {
          copyText.textContent = 'Copy address';
          iconCopy.hidden = false;
          iconCheck.hidden = true;
        }, 2000);
      });
    })();
  </script>
</body>
</html>
